<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AapdaSetu Disaster OS | Gateway Routing</title>
  <meta http-equiv="refresh" content="0;url=login.html">
  <style>
    body {
      background: #070c16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('aapdasetu_auth_v1');
        if (stored) {
          const session = JSON.parse(stored);
          if (session && session.role) {
            const routes = {
              admin: 'admin.html',
              shelter: 'shelter.html',
              citizen: 'citizen.html'
            };
            const target = routes[session.role] || 'login.html';
            window.location.replace(target);
            return;
          }
        }
      } catch (e) {
        console.warn('Routing parse error:', e);
      }
      window.location.replace('login.html');
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <div class="brand-title">AapdaSetu Disaster OS</div>
  <div class="sub">Routing to authorized operational portal...</div>
</body>
</html>
